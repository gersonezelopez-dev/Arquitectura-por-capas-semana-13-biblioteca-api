
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Personal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            color: #243447;
        }

        header {
            background-color: #17365d;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        main {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .panel {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px #00000015;
        }

        h2 {
            color: #17365d;
        }

        .formulario {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input {
            padding: 11px;
            border: 1px solid #ccd5df;
            border-radius: 5px;
            font-size: 15px;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0;
        }

        button {
            border: none;
            border-radius: 5px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .guardar {
            background: #1769aa;
            color: white;
        }

        .eliminar {
            background: #c62828;
            color: white;
        }

        .guardar:hover {
            background: #104d80;
        }

        .eliminar:hover {
            background: #981c1c;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #dddddd;
            text-align: left;
        }

        th {
            background: #17365d;
            color: white;
        }

        tr:hover {
            background: #f4f8fc;
        }

        .mensaje {
            padding: 13px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .exito {
            background: #d9f4df;
            color: #17612c;
        }

        .error {
            background: #fde0e0;
            color: #a51b1b;
        }

        .disponible {
            color: green;
            font-weight: bold;
        }

        .no-disponible {
            color: #b32020;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #526174;
        }

        @media (max-width: 650px) {
            .formulario {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Biblioteca Personal</h1>
    <p>Sistema de administración de libros</p>
</header>

<main>

    <div id="mensaje" role="alert" aria-live="polite"
         hidden></div>

    <section class="panel">
        <h2>Registrar nuevo libro</h2>

        <form id="formLibro">

            <div class="formulario">

                <div class="campo">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo"
                           maxlength="30" required>
                </div>

                <div class="campo">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo"
                           maxlength="150" required>
                </div>

                <div class="campo">
                    <label for="autor">Autor</label>
                    <input type="text" id="autor"
                           maxlength="100" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoría</label>
                    <input type="text" id="categoria"
                           maxlength="60" required>
                </div>

                <div class="campo">
                    <label for="anio">Año de publicación</label>
                    <input type="number" id="anio"
                           min="1" step="1" required>
                </div>

                <div class="campo">
                    <label for="precio">Precio (Q)</label>
                    <input type="number" id="precio"
                           min="0.01" step="0.01" required>
                </div>

            </div>

            <label class="check">
                <input type="checkbox" id="disponible" checked>
                Libro disponible
            </label>

            <button class="guardar" id="btnGuardar"
                    type="submit">
                Guardar libro
            </button>

        </form>
    </section>

    <section class="panel">
        <h2>Libros registrados</h2>

        <div class="tabla-contenedor">
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Categoría</th>
                    <th>Año</th>
                    <th>Precio</th>
                    <th>Disponible</th>
                    <th>Acción</th>
                </tr>
                </thead>

                <tbody id="tablaLibros">
                <tr>
                    <td colspan="8">Cargando libros...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    Biblioteca Personal - Programación II
</footer>

<script>
    const API = "/api/libros";

    const formulario = document.getElementById("formLibro");
    const tabla = document.getElementById("tablaLibros");
    const btnGuardar = document.getElementById("btnGuardar");

    function mostrarMensaje(texto, tipo) {
        const mensaje = document.getElementById("mensaje");

        mensaje.textContent = texto;
        mensaje.className = "mensaje " + tipo;
        mensaje.hidden = false;
    }

    function crearCelda(fila, valor) {
        const celda = document.createElement("td");
        celda.textContent = valor ?? "";
        fila.appendChild(celda);
        return celda;
    }

    async function cargarLibros() {
        try {
            const respuesta = await fetch(API);

            if (!respuesta.ok) {
                throw new Error("Error al consultar libros");
            }

            const libros = await respuesta.json();

            tabla.innerHTML = "";

            if (libros.length === 0) {
                const fila = document.createElement("tr");
                crearCelda(fila, "No hay libros registrados")
                    .colSpan = 8;
                tabla.appendChild(fila);
                return;
            }

            libros.forEach(libro => {
                const fila = document.createElement("tr");

                crearCelda(fila, libro.codigo);
                crearCelda(fila, libro.titulo);
                crearCelda(fila, libro.autor);
                crearCelda(fila, libro.categoria);
                crearCelda(fila, libro.anioPublicacion);

                const precio = Number(libro.precio);
                crearCelda(
                    fila,
                    Number.isFinite(precio)
                        ? "Q " + precio.toFixed(2)
                        : "Sin precio"
                );

                const estado = crearCelda(
                    fila,
                    libro.disponible ? "Sí" : "No"
                );

                estado.className = libro.disponible
                    ? "disponible"
                    : "no-disponible";

                const celdaAccion = document.createElement("td");
                const boton = document.createElement("button");

                boton.textContent = "Eliminar";
                boton.className = "eliminar";
                boton.type = "button";

                boton.addEventListener("click", () => {
                    eliminarLibro(libro.id);
                });

                celdaAccion.appendChild(boton);
                fila.appendChild(celdaAccion);
                tabla.appendChild(fila);
            });

        } catch (error) {
            mostrarMensaje(
                "No fue posible cargar los libros.", "error"
            );
        }
    }

    formulario.addEventListener("submit", async function(evento) {
        evento.preventDefault();

        if (!formulario.reportValidity()) {
            return;
        }

        const libro = {
            codigo: document.getElementById("codigo").value.trim(),
            titulo: document.getElementById("titulo").value.trim(),
            autor: document.getElementById("autor").value.trim(),
            categoria: document.getElementById("categoria").value.trim(),
            anioPublicacion: Number(
                document.getElementById("anio").value
            ),
            precio: Number(
                document.getElementById("precio").value
            ),
            disponible: document.getElementById("disponible").checked
        };

        if (!libro.codigo || !libro.titulo ||
            !libro.autor || !libro.categoria) {
            mostrarMensaje(
                "Complete todos los campos obligatorios.", "error"
            );
            return;
        }

        btnGuardar.disabled = true;

        try {
            const respuesta = await fetch(API, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(libro)
            });

            if (!respuesta.ok) {
                throw new Error("No se pudo registrar");
            }

            mostrarMensaje(
                "Libro registrado correctamente.", "exito"
            );

            formulario.reset();
            await cargarLibros();

        } catch (error) {
            mostrarMensaje(
                "No fue posible completar la operación.", "error"
            );
        } finally {
            btnGuardar.disabled = false;
        }
    });

    async function eliminarLibro(id) {
        const confirmar = confirm(
            "¿Desea eliminar el libro seleccionado?"
        );

        if (!confirmar) {
            return;
        }

        try {
            const respuesta = await fetch(API + "/" + id, {
                method: "DELETE"
            });

            if (!respuesta.ok) {
                throw new Error("No se pudo eliminar");
            }

            mostrarMensaje(
                "Libro eliminado correctamente.", "exito"
            );

            await cargarLibros();

        } catch (error) {
            mostrarMensaje(
                "No fue posible completar la operación.", "error"
            );
        }
    }

    cargarLibros();
</script>

</body>
</html>
